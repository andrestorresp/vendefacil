<div class="dashboard-container">
  <div class="header-section">
    <h1>Ingreso de Proveedores y Mercancía</h1>
    <p>Registra las compras y calcula los precios de venta automáticamente.</p>
  </div>

  <form [formGroup]="proveedorForm" (ngSubmit)="guardarIngreso()" class="form-container">
    
    <!-- Selector General de Compra -->
    <div class="dashboard-card provider-card" style="margin-bottom: 20px;">
      <div class="grid-form" style="grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label>¿Compra a crédito?</label>
          <select formControlName="compraAlContado" class="input-table">
            <option value="no">No (Al contado)</option>
            <option value="si">Sí (Ingresar datos del proveedor)</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label>Fecha de Ingreso</label>
          <input type="date" formControlName="fechaIngreso">
        </div>
      </div>
    </div>

    <!-- Tarjeta de Datos del Proveedor -->
    <div class="dashboard-card provider-card" *ngIf="proveedorForm.get('compraAlContado')?.value === 'si'">
      <h3>Datos del Proveedor</h3>
      
      <div class="grid-form">
        <div class="form-group">
          <label>Compañía</label>
          <input type="text" formControlName="compania" placeholder="Ej. Distribuidora Polar">
        </div>
        
        <div class="form-group">
          <label>Vendedor</label>
          <input type="text" formControlName="vendedor" placeholder="Nombre del vendedor">
        </div>

        <div class="form-group">
          <label>Fecha de Crédito</label>
          <input type="date" formControlName="fechaCredito">
        </div>

        <div class="form-group">
          <label>Vencimiento de Crédito</label>
          <input type="date" formControlName="fechaVencimiento">
        </div>
      </div>
    </div>

    <!-- Tarjeta de Productos -->
    <div class="dashboard-card products-card">
      <div class="products-header">
        <h3>Detalle de Productos</h3>
        <p class="tasa-info">
          Tasa BCV actual: <strong>{{ tasaActual()?.tasa || 0 }} Bs</strong>
        </p>
      </div>

      <div class="table-responsive" formArrayName="productos">
        <table class="products-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Costo Unit. ($)</th>
              <th>Ganancia (%)</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let prod of productos.controls; let i=index" [formGroupName]="i">
              <td>
                <input type="text" formControlName="nombre" placeholder="Nombre..." class="input-table">
              </td>
              <td>
                <input type="number" formControlName="cantidad" min="1" class="input-table-small">
              </td>
              <td>
                <input type="number" formControlName="costoUsd" min="0" step="0.01" class="input-table-small">
              </td>
              <td>
                <input type="number" formControlName="margenGanancia" min="0" class="input-table-small">
              </td>
              <td>
                <button type="button" class="btn-delete" (click)="eliminarProducto(i)" *ngIf="productos.length > 1" title="Eliminar fila">
                  ✖
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="actions-footer">
        <button type="button" class="btn-secondary" (click)="agregarProducto()">+ Añadir Producto</button>
        <button type="submit" class="btn-primary" [disabled]="proveedorForm.invalid">Validar Ingreso</button>
      </div>
    </div>
  </form>
</div>
